# Historical real-data template: see docs/REPRODUCIBILITY.md before running.
# Copy to configs/real.local.yaml and use your authorized private paths.
data:
  source: mimic_dir
  mimic_dir: data/mimic-iv-ed-2.2/ed
  n_stays: null
  cache_dir: data/cache_real
  seed: 42
  mimic_core_dir: data/mimic-iv-2.2
tasks:
- critical
- hosp
- revisit72
- edlos
- death
- sepsis24h
main_task: critical
splits:
  random_test_size: 0.2
  random_val_size: 0.2
  temporal_cutoff: '2017-01-01'
seeds:
- 0
- 1
- 2
- 3
- 4
baselines:
  models:
  - lr
  - xgb
  - lgbm
  clinical_scores:
  - news2
  - qsofa
text:
  encoder: emilyalsentzer/Bio_ClinicalBERT
  max_len: 32
  fallback: hashing
  batch_size: 128
tlqt:
  d_model: 128
  n_layers: 4
  n_heads: 4
  n_query: 28  # Model uses sum(query_groups), not this legacy field.
  query_groups:
    C: 16
    J: 4
    P: 4
    D: 4
  dropout: 0.1
  horizon_h: 24
  batch_size: 512
  epochs: 15
  lr: 0.001
  weight_decay: 0.01
  early_stop_patience: 4
  bf16: true
audit:
  e1_combos:
    full:
    - C
    - J
    - P
    - D
    clin_only:
    - C
    - D
    meta_only:
    - J
    - P
    - D
    noJ:
    - C
    - P
    - D
    noP:
    - C
    - J
    - D
  e2_fields:
  - acuity
  - arrival_transport
  - hour_of_day
  - day_of_week
  - n_ed_visits_365d
  bootstrap: 2000
  alpha: 0.05
  e1_tasks:
  - critical
  - sepsis24h
eval:
  subgroups:
  - anchor_age
  - gender
  - arrival_transport
  - acuity
  dca_thresholds:
  - 0.01
  - 0.5
  - 50
results_root: results_real
device: cuda
